name: 自动编译未签名 IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 整理目录结构
        shell: bash
        run: |
          PBX=$(find . -type f -name 'project.pbxproj' -not -path './DerivedData/*' -not -path './.git/*' 2>/dev/null | head -n 1 || true)
          echo "project.pbxproj = ${PBX:-（未找到）}"
          if [ -z "$PBX" ]; then echo "::error::找不到 project.pbxproj"; exit 1; fi
          SRC=$(dirname "$(dirname "$PBX")")
          if [ "$SRC" != "." ]; then echo "拍平 $SRC"; cp -R "$SRC"/. ./; fi
          if [ ! -f WatermarkCamera/AppEntry.swift ]; then
            A=$(find . -type f -name 'AppEntry.swift' -not -path './DerivedData/*' -not -path './WatermarkCamera/*' 2>/dev/null | head -n 1 || true)
            if [ -n "$A" ]; then
              D=$(dirname "$A"); echo "源码目录 $D → WatermarkCamera"; mkdir -p WatermarkCamera
              if [ "$D" = "." ]; then
                cp ./*.swift ./WatermarkCamera/ 2>/dev/null || true
                cp ./Info.plist ./WatermarkCamera/ 2>/dev/null || true
                mkdir -p WatermarkCamera/RouteWeb
                cp -R ./RouteWeb/. ./WatermarkCamera/RouteWeb/ 2>/dev/null || true
              else
                cp -R "$D"/. ./WatermarkCamera/
              fi
            fi
          fi
          for f in WatermarkCamera.xcodeproj/project.pbxproj WatermarkCamera/AppEntry.swift WatermarkCamera/RouteView.swift WatermarkCamera/RouteWeb/index.html WatermarkCamera/RouteWeb/xlsx.full.min.js; do
            if [ -f "$f" ]; then echo "OK   $f"; else echo "MISS $f"; fi
          done
          test -f WatermarkCamera.xcodeproj/project.pbxproj || { echo "::error::工程缺失"; exit 1; }
          test -f WatermarkCamera/RouteWeb/index.html || { echo "::error::路单页缺失"; exit 1; }
      - name: 编译（关闭签名）
        shell: bash
        run: |
          xcodebuild -project WatermarkCamera.xcodeproj -scheme WatermarkCamera -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ./DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: 打包 IPA
        shell: bash
        run: |
          APP=$(find ./DerivedData/Build/Products -name 'WatermarkCamera.app' -type d 2>/dev/null | head -n 1 || true)
          test -n "$APP" || { echo "::error::编译产物缺失"; exit 1; }
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry WatermarkCamera-unsigned.ipa Payload
          ls -lh WatermarkCamera-unsigned.ipa
      - name: 提供下载
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkCamera-IPA-未签名
          path: WatermarkCamera-unsigned.ipa
          retention-days: 30
